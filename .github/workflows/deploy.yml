name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Prepare GitHub Pages
        run: |
          if [ -f .output/public/_shell.html ]; then
            cp .output/public/_shell.html .output/public/index.html
          fi

          if [ ! -f .output/public/index.html ]; then
            echo "Error: index.html and _shell.html were not found."
            find .output/public -maxdepth 3 -type f -name '*.html'
            exit 1
          fi

          cp .output/public/index.html .output/public/404.html
          touch .output/public/.nojekyll


      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public


      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
